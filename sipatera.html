<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>SIPATERA</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --ink:#182848;
  --ink-2:#233766;
  --paper:#F6F1E4;
  --paper-2:#EFE8D6;
  --stamp-red:#AE3A2E;
  --seal-gold:#B4842A;
  --approve:#3F6B4F;
  --line: rgba(24,40,72,0.16);
  --text-soft: rgba(24,40,72,0.62);
}
*{box-sizing:border-box;}
body{
  margin:0;
  background: radial-gradient(circle at 15% 0%, #22345f 0%, var(--ink) 45%, #101c38 100%);
  font-family:'IBM Plex Sans', sans-serif;
  color: var(--ink);
  min-height:100vh;
  padding: 32px 20px 80px;
}
.wrap{max-width: 1040px; margin: 0 auto;}

/* ---------- Header ---------- */
header{
  display:flex; justify-content:space-between; align-items:flex-end;
  margin-bottom: 26px; flex-wrap:wrap; gap:14px;
}
.brand-mark{
  display:flex; align-items:center; gap:14px;
}
.seal{
  width:52px;height:52px;border-radius:50%;
  border:2px solid #d8c69a; display:flex;align-items:center;justify-content:center;
  color:#e8dcb8; font-family:'Source Serif 4',serif; font-weight:700; font-size:18px;
  flex-shrink:0;
}
h1{
  font-family:'Source Serif 4', serif; font-weight:700;
  color:#F6F1E4; margin:0; font-size: 30px; letter-spacing:0.5px;
}
header p{margin:2px 0 0; color:#B9C3DE; font-size:13.5px;}
.tracking{
  font-family:'IBM Plex Mono',monospace; font-size:12px; color:#B9C3DE;
  text-align:right;
}
.sync-badge{
  font-family:'IBM Plex Mono',monospace; font-size:10.5px; margin-top:4px;
  padding:2px 8px; border-radius:10px; display:inline-block;
}
.sync-on{background:rgba(63,107,79,0.25); color:#BFE1CB;}
.sync-off{background:rgba(174,58,46,0.2); color:#F1C3BC;}

/* ---------- Role tabs ---------- */
.tabs{
  display:flex; gap:6px; margin-bottom:22px; flex-wrap:wrap;
  border-bottom: 1px solid rgba(246,241,228,0.18); padding-bottom: 0;
}
.tab{
  padding:10px 16px; cursor:pointer; color:#B9C3DE; font-size:13.5px; font-weight:500;
  border-bottom:2px solid transparent; transition: all .15s ease; user-select:none;
  display:flex; align-items:center; gap:7px;
}
.tab:hover{color:#F6F1E4;}
.tab.active{color:#F6F1E4; border-bottom-color: var(--seal-gold);}
.tab .dot{width:6px;height:6px;border-radius:50%; background:var(--seal-gold); opacity:0;}
.tab.active .dot{opacity:1;}

/* ---------- Panels / cards (paper) ---------- */
.sheet{
  background: var(--paper);
  border-radius: 3px;
  box-shadow: 0 18px 40px rgba(8,14,32,0.35), 0 1px 0 rgba(255,255,255,0.4) inset;
  padding: 22px 24px;
  margin-bottom: 18px;
  position:relative;
}
.sheet::before{
  content:''; position:absolute; left:0; top:14px; bottom:14px; width:3px;
  background: var(--seal-gold); border-radius: 0 2px 2px 0;
}
.sheet h2{
  font-family:'Source Serif 4', serif; font-size:19px; margin:0 0 4px 6px; color:var(--ink);
}
.sheet .sub{margin:0 0 16px 6px; color:var(--text-soft); font-size:13px;}

/* ---------- Form ---------- */
label{display:block; font-size:12px; font-weight:600; color:var(--ink-2); margin-bottom:5px; letter-spacing:0.2px;}
input[type=text], input[type=date], input[type=url], textarea, select{
  width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:3px;
  background:#fffdf8; font-family:'IBM Plex Sans'; font-size:13.5px; color:var(--ink);
  margin-bottom:14px;
}
textarea{resize:vertical; min-height:56px;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:0 16px;}
.doc-list{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 14px 0;}
.doc-chip{
  display:flex; align-items:center; gap:6px; padding:6px 10px; border:1px solid var(--line);
  border-radius:20px; font-size:12.5px; background:#fffdf8; cursor:pointer;
}
.doc-chip input{margin:0; width:auto;}
.doc-list-files{display:grid; grid-template-columns:1fr 1fr; gap:4px 16px; margin-bottom:14px;}
.doc-file-row{margin-bottom:8px;}
.doc-file-row input[type=file]{
  width:100%; padding:7px 8px; border:1px solid var(--line); border-radius:3px;
  background:#fffdf8; font-size:12px; margin-bottom:0;
}
.btn{
  border:none; border-radius:3px; padding:10px 18px; font-size:13.5px; font-weight:600;
  cursor:pointer; font-family:'IBM Plex Sans'; letter-spacing:0.2px; transition: transform .1s ease, opacity .15s ease;
}
.btn:active{transform: scale(0.97);}
.btn-primary{background: var(--ink); color:#F6F1E4;}
.btn-primary:hover{background: var(--ink-2);}
.btn-approve{background: var(--approve); color:#fff;}
.btn-reject{background: var(--stamp-red); color:#fff;}
.btn-ghost{background:transparent; color:var(--ink-2); border:1px solid var(--line);}
.btn:disabled{opacity:0.4; cursor:not-allowed;}
.btn-sm{padding:7px 12px; font-size:12.5px;}

/* ---------- Case card ---------- */
.case{
  background:#fffdf8; border:1px solid var(--line); border-radius:4px; padding:16px 18px; margin-bottom:14px;
}
.case-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap;}
.case-id{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color: var(--text-soft);}
.case-title{font-family:'Source Serif 4',serif; font-size:17px; margin:2px 0 4px;}
.case-meta{font-size:12.5px; color:var(--text-soft); line-height:1.6;}
.badge{
  font-size:11px; font-weight:600; padding:4px 10px; border-radius:20px; white-space:nowrap;
  border:1px solid transparent;
}
.badge-progress{background:#EFE4C4; color:#7A5A16; border-color:#DCC688;}
.badge-final-ok{background:#DDEBE1; color:var(--approve); border-color:#B6D2BF;}
.badge-final-bad{background:#F3DEDA; color:var(--stamp-red); border-color:#E4BAB1;}
.badge-pay{background:#DCE6F5; color:#1E4C8C; border-color:#B7CBEA;}

/* ---------- Routing rail (signature element) ---------- */
.rail{display:flex; align-items:center; margin: 14px 2px 14px; overflow-x:auto; padding-bottom:2px;}
.rail-step{display:flex; flex-direction:column; align-items:center; min-width:72px; flex-shrink:0; position:relative;}
.rail-seal{
  width:24px;height:24px;border-radius:50%; border:2px solid var(--line); background:#fff;
  display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:var(--text-soft);
  z-index:2;
}
.rail-step.done .rail-seal{border-color: var(--approve); color:var(--approve); background:#EAF3EC;}
.rail-step.current .rail-seal{border-color: var(--seal-gold); color:#8A5F16; background:#FBF1D9; box-shadow:0 0 0 4px rgba(180,132,42,0.18);}
.rail-step.bad .rail-seal{border-color: var(--stamp-red); color:var(--stamp-red); background:#FBEAE7;}
.rail-label{font-size:9.5px; text-align:center; color:var(--text-soft); margin-top:5px; max-width:70px; line-height:1.25;}
.rail-line{flex:1; height:2px; background: var(--line); margin: 0 -2px; position:relative; top:-14px;}
.rail-line.done{background: var(--approve);}

.note{font-size:12.5px; color:var(--text-soft); background:var(--paper-2); border-radius:3px; padding:8px 10px; margin-top:10px;}
.note b{color:var(--ink);}
.actions{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; align-items:center;}
.empty{
  text-align:center; padding:34px 10px; color:var(--text-soft); font-size:13.5px;
}

/* ---------- Payment block ---------- */
.pay-block{
  margin-top:12px; padding:14px; border:1px dashed var(--seal-gold); border-radius:4px;
  background:#FFFCF3; display:flex; gap:16px; flex-wrap:wrap; align-items:center;
}
.pay-block img{width:120px; height:auto; border-radius:3px; border:1px solid var(--line); flex-shrink:0;}
.pay-info{flex:1; min-width:180px;}
.pay-info .lbl{font-size:11px; color:var(--text-soft); text-transform:uppercase; letter-spacing:0.4px; margin-bottom:2px;}
.pay-info .val{font-family:'Source Serif 4',serif; font-size:15px; color:var(--ink); margin-bottom:6px;}

/* ---------- Monitoring stats ---------- */
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px; margin-bottom:6px;}
.stat{border:1px solid var(--line); border-radius:4px; padding:12px 14px; background:#fffdf8;}
.stat .num{font-family:'Source Serif 4',serif; font-size:26px; color:var(--ink);}
.stat .lbl{font-size:11px; color:var(--text-soft); text-transform:uppercase; letter-spacing:0.4px;}

.hint{color:#B9C3DE; font-size:12px; text-align:center; margin-top:26px;}
.sync-note{font-size:11.5px; color:var(--text-soft); margin:0 0 10px 6px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand-mark">
      <div class="seal">SP</div>
      <div>
        <h1>SIPATERA</h1>
        <p>Sistem Peminjaman Sarana &amp; Prasarana</p>
      </div>
    </div>
    <div style="text-align:right;">
      <div class="tracking" id="clock"></div>
      <div id="syncBadge" class="sync-badge sync-on">Mode lokal: aktif</div>
    </div>
  </header>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>
  <div class="hint">Data tersimpan otomatis di browser ini dan dapat diproses melalui tab Admin.</div>
</div>

/* ---------------- penyimpanan lokal browser ---------------- */
async function loadData(){
  try{
    const raw = localStorage.getItem('sipatera-data');
    DATA = raw ? JSON.parse(raw) : [];
    if(!Array.isArray(DATA)) DATA = [];
  }catch(e){ DATA = []; }
}
async function saveData(){
  try{
    localStorage.setItem('sipatera-data', JSON.stringify(DATA));
  }catch(e){ console.error('Gagal menyimpan data lokal', e); }
  await syncToGoogleSheet();
}
async function loadConfig(){
  try{
    const raw = localStorage.getItem('sipatera-config');
    CONFIG = raw ? JSON.parse(raw) : {scriptUrl:''};
    if(!CONFIG || typeof CONFIG.scriptUrl !== 'string') CONFIG = {scriptUrl:''};
  }catch(e){ CONFIG = {scriptUrl:''}; }
  updateSyncBadge();
}
async function saveConfig(){
  localStorage.setItem('sipatera-config', JSON.stringify(CONFIG));
  updateSyncBadge();
}
function updateSyncBadge(){
  const badge = document.getElementById('syncBadge');
  if(!badge) return;
  badge.textContent = CONFIG.scriptUrl ? 'Sinkronisasi Sheet: aktif' : 'Mode lokal: aktif';
  badge.className = CONFIG.scriptUrl ? 'sync-badge sync-on' : 'sync-badge sync-off';
}
async function syncToGoogleSheet(){
  if(!CONFIG.scriptUrl) return false;
  try{
    const response = await fetch(CONFIG.scriptUrl, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'sync', data:DATA})
    });
    return response.ok;
  }catch(e){
    console.warn('Sinkronisasi Google Sheet gagal', e);
    return false;
  }
}
async function pullFromGoogleSheet(){
  if(!CONFIG.scriptUrl) return false;
  try{
    const response = await fetch(CONFIG.scriptUrl);
    if(!response.ok) return false;
    const result = await response.json();
    if(!Array.isArray(result.data)) return false;
    DATA = result.data;
    localStorage.setItem('sipatera-data', JSON.stringify(DATA));
    return true;
  }catch(e){
    console.warn('Gagal mengambil data dari Google Sheet', e);
    return false;
  }
}

function nextNomor(){
  const year = new Date().getFullYear();
  const count = DATA.filter(d => d.nomor && d.nomor.includes(`SIP-${year}`)).length + 1;
  return `SIP-${year}-${String(count).padStart(4,'0')}`;
}
function log(item, ket){
  item.riwayat.push({waktu: new Date().toLocaleString('id-ID'), ket});
}
function fmtDate(d){ return d ? d : '-'; }

/* ---------------- rendering ---------------- */
function renderTabs(){
  const el = document.getElementById('tabs');
  el.innerHTML = ROLES.map(r => `
    <div class="tab ${r.id===role?'active':''}" data-role="${r.id}">
      <span class="dot"></span>${r.label}
    </div>`).join('');
  el.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    role = t.dataset.role; render();
  }));
}

  const meta = STATUS_META[status];
  return `<div class="rail">${STAGES.map((s,i) => {
    let cls = '';
    if(meta.kind==='bad' && i===meta.step) cls='bad';
    else if(meta.kind==='bad' && i<meta.step) cls='done';
    else if(i < meta.step || (meta.kind==='good')) cls='done';
    else if(i === meta.step && meta.kind==='progress') cls='current';
    const line = i < STAGES.length-1 ? `<div class="rail-line ${(i<meta.step || meta.kind==='good')?'done':''}"></div>` : '';
    return `<div class="rail-step ${cls}">
        <div style="display:flex;align-items:center;width:100%;">
          <div class="rail-seal">${cls==='done'||meta.kind==='good'&&i<=meta.step?'✓':(i+1)}</div>
          ${line}
        </div>
        <div class="rail-label">${s.label}</div>
      </div>`;
  }).join('')}</div>`;
}

function badgeHTML(status){
  const meta = STATUS_META[status];
  let cls = 'badge-progress';
  if(meta.kind==='bad') cls='badge-final-bad';
  else if(meta.kind==='good') cls='badge-final-ok';
  else if(status==='pembayaran') cls='badge-pay';
  return `<span class="badge ${cls}">${meta.text}</span>`;
}

function qrBlockHTML(item){
  if(item.status !== 'pembayaran') return '';
  return `
    <div class="pay-block">
      <img src="${QR_IMG}" alt="QRIS Pembayaran">
      <div class="pay-info">
        <div class="lbl">RTB Pemakaian Alat DPU</div>
        <div class="val">Scan QRIS untuk membayar biaya pemakaian</div>
        <div class="lbl">Referensi</div>
        <div class="val" style="font-size:13px;">${item.nomor}</div>
        ${item.buktiBayar ? `<div class="note"><b>Bukti/keterangan bayar:</b> ${item.buktiBayar}</div>` : ''}
      </div>
    </div>`;
}

function caseCard(item, actionsHTML){
  return `
  <div class="case" data-id="${item.id}">
    <div class="case-top">
      <div>
        <div class="case-id">${item.nomor}</div>
        <div class="case-title">${item.aset}</div>
        <div class="case-meta">
          Pemohon: <b>${item.pemohon}</b> — ${item.unit}<br>
          Keperluan: ${item.keperluan}<br>
          Jadwal digunakan: ${fmtDate(item.tglMulai)} s/d ${fmtDate(item.tglSelesai)}
          ${item.jadwalDitetapkan ? `<br>Jadwal ditetapkan pengelola: <b>${item.jadwalDitetapkan}</b>` : ''}
        </div>
      </div>
      ${badgeHTML(item.status)}
    </div>
    ${railHTML(item.status)}
    ${item.catatan ? `<div class="note"><b>Catatan:</b> ${item.catatan}</div>` : ''}
    ${item.dokumen && item.dokumen.length ? `<div class="note"><b>Berkas:</b> ${item.dokumen.map(d =>
      d.url ? `<a href="${d.url}" target="_blank" rel="noopener">${d.nama}</a>` : `${d.nama}${d.fileName ? `: ${d.fileName}` : ''} <i>(tersimpan sebagai data lokal)</i>`
      ).join(' &middot; ')}</div>` : ''}
    ${qrBlockHTML(item)}
    ${actionsHTML ? `<div class="actions">${actionsHTML}</div>` : ''}
  </div>`;
}

function render(){
  renderTabs();
  const c = document.getElementById('content');
  if(role==='pemohon') c.innerHTML = viewPemohon();
  else if(role==='admin') c.innerHTML = viewAdmin();
  else if(role==='pengelola') c.innerHTML = viewPengelola();
  else if(role==='kabid') c.innerHTML = viewKabid();
  else c.innerHTML = viewMonitoring();
  bindActions();
}

/* ---------------- role views ---------------- */
function viewPemohon(){
  const list = [...DATA].reverse();
  return `
  <div class="sheet">
    <h2>Isi Form Permohonan</h2>
    <p class="sub">Lengkapi data lalu unggah dokumen pendukung untuk mengajukan peminjaman.</p>
    <form id="formPemohon">
      <div class="grid2">
        <div><label>Nama Pemohon</label><input type="text" name="pemohon" required></div>
        <div><label>Unit / Instansi</label><input type="text" name="unit" required></div>
      </div>
      <label>Sarana / Alat Berat yang Diminta</label>
      <select name="aset" id="asetSelect" required>
        <option value="" disabled selected>— Pilih alat —</option>
        ${ASET_LIST.map(g => `<optgroup label="${g.jenis}">${g.items.map(it =>
          `<option value="${g.jenis} — ${it.nama}">${it.nama} (${it.jumlah})</option>`
        ).join('')}</optgroup>`).join('')}
        <option value="__lainnya__">Lainnya (isi manual)</option>
      </select>
      <input type="text" id="asetLainnya" placeholder="Tulis nama alat/sarana lain" style="display:none;">
      <label>Keperluan</label>
      <textarea name="keperluan" placeholder="Jelaskan tujuan penggunaan" required></textarea>
      <div class="grid2">
        <div><label>Tanggal Mulai Digunakan</label><input type="date" name="tglMulai" required></div>
        <div><label>Tanggal Selesai Digunakan</label><input type="date" name="tglSelesai" required></div>
      </div>
      <label>Pilih Berkas Dokumen (nama berkas disimpan di browser)</label>
      <div class="doc-list-files">
        ${DOC_OPTIONS.map((d,i) => `
          <div class="doc-file-row">
            <label style="margin-bottom:2px;">${d}</label>
            <input type="file" id="file-${i}" data-doc="${d}" accept="image/*,.pdf,.doc,.docx">
          </div>`).join('')}
      </div>
      <button type="submit" class="btn btn-primary" id="btnKirim">Kirim Permohonan</button>
    </form>
  </div>
  <div class="sheet">
    <h2>Permohonan Saya</h2>
    <p class="sub">Status seluruh permohonan yang telah diajukan.</p>
    ${list.length===0 ? `<div class="empty">Belum ada permohonan.</div>` : list.map(item => {
      let actions = '';
      if(item.status==='dikembalikan') actions = `<button class="btn btn-primary" data-act="ajukan_ulang" data-id="${item.id}">Ajukan Ulang</button>`;
      if(item.status==='penggunaan') actions = `<button class="btn btn-approve" data-act="selesai_pakai" data-id="${item.id}">Selesai Digunakan → Kembalikan</button>`;
      return caseCard(item, actions);
    }).join('')}
  </div>`;
}

function viewAdmin(){
  const list = DATA.filter(d => d.status==='diajukan');
  return `
  <div class="sheet">
    <h2>Admin Verifikasi</h2>
    <p class="sub">Periksa kelengkapan data dan dokumen, lalu teruskan atau kembalikan permohonan.</p>
    <div class="note"><b>${list.length}</b> permohonan menunggu verifikasi admin.</div>
    ${list.length===0 ? `<div class="empty">Tidak ada permohonan menunggu verifikasi.</div>` : list.map(item => caseCard(item, `
      <button class="btn btn-approve" data-act="lengkap" data-id="${item.id}">Lengkap → Teruskan</button>
      <button class="btn btn-reject" data-act="tidak_lengkap" data-id="${item.id}">Tidak Lengkap → Kembalikan</button>
    `)).join('')}
  </div>`;
}

function viewPengelola(){
  const cek = DATA.filter(d => d.status==='cek_ketersediaan');
  const jadwal = DATA.filter(d => d.status==='penjadwalan');
  const bayar = DATA.filter(d => d.status==='pembayaran');
  const serah = DATA.filter(d => d.status==='serah_terima');
  const kembali = DATA.filter(d => d.status==='pengembalian');
  const section = (title, sub, items, body) => `
    <div class="sheet"><h2>${title}</h2><p class="sub">${sub}</p>
    ${items.length===0 ? `<div class="empty">Tidak ada data pada tahap ini.</div>` : items.map(body).join('')}</div>`;

  return section('Pengelola — Cek Ketersediaan','Pastikan sarana/aset yang diminta tersedia.', cek, item => caseCard(item, `
      <button class="btn btn-approve" data-act="tersedia" data-id="${item.id}">Tersedia → Teruskan</button>
      <button class="btn btn-reject" data-act="tidak_ada" data-id="${item.id}">Tidak Ada → Tolak</button>
    `))
  + section('Pengelola — Penjadwalan','Tetapkan jadwal penggunaan.', jadwal, item => caseCard(item, `
      <input type="text" placeholder="Jadwal ditetapkan, mis. 10-12 Agustus 2026" style="max-width:260px;display:inline-block;margin:0 8px 0 0;" id="jadwal-${item.id}">
      <button class="btn btn-primary" data-act="tetapkan_jadwal" data-id="${item.id}">Tetapkan Jadwal</button>
    `))
  + section('Pengelola — Pembayaran (QRIS)','Tunjukkan QRIS kepada pemohon lalu konfirmasi setelah pembayaran diterima.', bayar, item => caseCard(item, `
      <input type="text" placeholder="Keterangan/no. referensi bayar (opsional)" style="max-width:260px;display:inline-block;margin:0 8px 0 0;" id="bayar-${item.id}">
      <button class="btn btn-approve" data-act="konfirmasi_bayar" data-id="${item.id}">Pembayaran Diterima → Teruskan</button>
    `))
  + section('Pengelola — Serah Terima','Konfirmasi serah terima sarana/aset ke pemohon.', serah, item => caseCard(item, `
      <button class="btn btn-approve" data-act="serah_terima" data-id="${item.id}">Konfirmasi Serah Terima</button>
    `))
  + section('Pengelola — Pengembalian','Konfirmasi sarana/aset telah dikembalikan.', kembali, item => caseCard(item, `
      <button class="btn btn-approve" data-act="konfirmasi_kembali" data-id="${item.id}">Konfirmasi Pengembalian</button>
    `));
}

function viewKabid(){
  const list = DATA.filter(d => d.status==='persetujuan');
  return `
  <div class="sheet">
    <h2>Persetujuan Kabid / Kadis</h2>
    <p class="sub">Sarana/aset tersedia dan siap disetujui untuk dijadwalkan.</p>
    ${list.length===0 ? `<div class="empty">Tidak ada permohonan menunggu persetujuan.</div>` : list.map(item => caseCard(item, `
      <button class="btn btn-approve" data-act="setujui" data-id="${item.id}">Setujui → Penjadwalan</button>
    `)).join('')}
  </div>`;
}

function viewMonitoring(){
  const total = DATA.length;
  const counts = {};
  Object.keys(STATUS_META).forEach(s => counts[s] = DATA.filter(d=>d.status===s).length);
  const selesai = counts.selesai||0;
  const ditolakDikembalikan = (counts.ditolak||0)+(counts.dikembalikan||0);
  const berjalan = total - selesai - ditolakDikembalikan;
  const list = [...DATA].reverse();
  return `
  <div class="sheet">
    <h2>Monitoring &amp; Laporan</h2>
    <p class="sub">Rekapitulasi seluruh siklus permohonan sarana &amp; prasarana.</p>
    <div class="stats">
      <div class="stat"><div class="num">${total}</div><div class="lbl">Total Permohonan</div></div>
      <div class="stat"><div class="num">${berjalan}</div><div class="lbl">Sedang Berjalan</div></div>
      <div class="stat"><div class="num">${selesai}</div><div class="lbl">Selesai</div></div>
      <div class="stat"><div class="num">${ditolakDikembalikan}</div><div class="lbl">Ditolak / Dikembalikan</div></div>
    </div>
  </div>
  <div class="sheet">
    <h2>Google Sheet</h2>
    <p class="sub">Hubungkan Web App Apps Script agar data bisa dipakai bersama dari beberapa perangkat.</p>
    <input type="url" id="scriptUrlInput" placeholder="https://script.google.com/macros/s/AKfycbzG6y6bO45_Y-9n-OxkNhQRv6RtV4UjOMozOb-Gs4CCnoq6QXvmDmlnNLssVDEWCACfrw/exechttps://script.google.com/macros/s/AKfycbw310PEvNszBSxyQJkESBMOmE2jUNyIO_fKQBV0kgNOOf-0xVAkBSVWMeuEyrftcEDs/exec" value="${escapeHTML(CONFIG.scriptUrl)}">
    <div class="actions">
      <button class="btn btn-primary btn-sm" id="btnSaveUrl">Simpan URL</button>
      <button class="btn btn-ghost btn-sm" id="btnSyncNow">Kirim ke Sheet</button>
      <button class="btn btn-ghost btn-sm" id="btnPullNow">Tarik dari Sheet</button>
    </div>
  </div>
  <div class="sheet">
    <h2>Riwayat Lokal Seluruh Permohonan</h2>
    <p class="sub">Klik status untuk melihat jejak proses masing-masing permohonan.</p>
    ${list.length===0 ? `<div class="empty">Belum ada data.</div>` : list.map(item => `
      <div class="case">
        <div class="case-top">
          <div>
            <div class="case-id">${item.nomor}</div>
            <div class="case-title">${item.aset}</div>
            <div class="case-meta">Pemohon: <b>${item.pemohon}</b> — ${item.unit}</div>
          </div>
          ${badgeHTML(item.status)}
        </div>
        ${railHTML(item.status)}
        <details>
          <summary style="cursor:pointer;font-size:12.5px;color:var(--ink-2);margin-top:8px;">Lihat riwayat proses</summary>
          <div class="note" style="margin-top:8px;">
            ${item.riwayat.map(r => `${r.waktu} — ${r.ket}`).join('<br>')}
          </div>
        </details>
      </div>
    `).join('')}
  </div>`;
}

/* ---------------- actions ---------------- */
function bindActions(){
  const asetSelect = document.getElementById('asetSelect');
  const asetLainnya = document.getElementById('asetLainnya');
  if(asetSelect){
    asetSelect.addEventListener('change', () => {
      asetLainnya.style.display = asetSelect.value==='__lainnya__' ? 'block' : 'none';
      asetLainnya.required = asetSelect.value==='__lainnya__';
    });
  }

  const btnSaveUrl = document.getElementById('btnSaveUrl');
  if(btnSaveUrl) btnSaveUrl.addEventListener('click', async () => {
    CONFIG.scriptUrl = document.getElementById('scriptUrlInput').value.trim();
    await saveConfig();
    alert(CONFIG.scriptUrl ? 'URL Web App disimpan.' : 'Koneksi Google Sheet dinonaktifkan.');
    render();
  });
  const btnSyncNow = document.getElementById('btnSyncNow');
  if(btnSyncNow) btnSyncNow.addEventListener('click', async () => {
    if(!CONFIG.scriptUrl){ alert('Simpan URL Web App terlebih dahulu.'); return; }
    alert(await syncToGoogleSheet() ? 'Data berhasil dikirim ke Google Sheet.' : 'Gagal mengirim data.');
  });
  const btnPullNow = document.getElementById('btnPullNow');
  if(btnPullNow) btnPullNow.addEventListener('click', async () => {
    if(!CONFIG.scriptUrl){ alert('Simpan URL Web App terlebih dahulu.'); return; }
    const success = await pullFromGoogleSheet();
    alert(success ? 'Data berhasil ditarik dari Google Sheet.' : 'Gagal menarik data.');
    if(success) render();
  });

  const form = document.getElementById('formPemohon');
  if(form){
    form.addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('btnKirim');
      btn.disabled = true; btn.textContent = 'Mengirim...';
      try{
        const fd = new FormData(form);
        const nomor = nextNomor();
        let asetVal = fd.get('aset');
        if(asetVal === '__lainnya__') asetVal = document.getElementById('asetLainnya').value.trim();

        const fileInputs = form.querySelectorAll('input[type=file]');
        const dokumen = [];
        for(const inp of fileInputs){
          const f = inp.files && inp.files[0];
          if(!f) continue;
          const docName = inp.dataset.doc;
          dokumen.push({nama:docName, fileName:f.name, url:''});
        }

        const item = {
          id: 'p'+Date.now(),
          nomor,
          pemohon: fd.get('pemohon'), unit: fd.get('unit'), aset: asetVal,
          keperluan: fd.get('keperluan'), tglMulai: fd.get('tglMulai'), tglSelesai: fd.get('tglSelesai'),
          dokumen, status: 'diajukan', catatan:'', jadwalDitetapkan:'', buktiBayar:'', riwayat: []
        };
        log(item, 'Permohonan diajukan oleh pemohon.');
        DATA.push(item);
        await saveData();
        render();
      } finally {
        if(document.getElementById('btnKirim')){
          document.getElementById('btnKirim').disabled = false;
          document.getElementById('btnKirim').textContent = 'Kirim Permohonan';
        }
      }
    });
  }

  document.querySelectorAll('[data-act]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      const item = DATA.find(d => d.id===id);
      if(!item) return;
      const act = btn.dataset.act;

      if(act==='lengkap'){ item.status='cek_ketersediaan'; item.catatan=''; log(item,'Dokumen dinyatakan lengkap oleh admin.'); }
      if(act==='tidak_lengkap'){
        const alasan = prompt('Catatan kekurangan dokumen:','Dokumen belum lengkap');
        item.status='dikembalikan'; item.catatan = alasan||''; log(item,'Dikembalikan admin: '+ (alasan||'-'));
      }
      if(act==='ajukan_ulang'){ item.status='diajukan'; item.catatan=''; log(item,'Diajukan ulang oleh pemohon.'); }
      if(act==='tersedia'){ item.status='persetujuan'; item.catatan=''; log(item,'Sarana/aset dinyatakan tersedia oleh pengelola.'); }
      if(act==='tidak_ada'){
        const alasan = prompt('Catatan penolakan:','Sarana/aset tidak tersedia');
        item.status='ditolak'; item.catatan = alasan||''; log(item,'Ditolak pengelola: '+(alasan||'-'));
      }
      if(act==='setujui'){ item.status='penjadwalan'; item.catatan=''; log(item,'Disetujui oleh Kabid/Kadis.'); }
      if(act==='tetapkan_jadwal'){
        const val = document.getElementById('jadwal-'+id).value.trim();
        if(!val){ alert('Isi jadwal terlebih dahulu.'); return; }
        item.jadwalDitetapkan = val; item.status='pembayaran'; log(item,'Jadwal ditetapkan: '+val+'. Menunggu pembayaran QRIS.');
      }
      if(act==='konfirmasi_bayar'){
        const ket = document.getElementById('bayar-'+id) ? document.getElementById('bayar-'+id).value.trim() : '';
        item.buktiBayar = ket; item.status='serah_terima'; log(item,'Pembayaran QRIS dikonfirmasi diterima oleh pengelola.'+(ket?(' Keterangan: '+ket):''));
      }
      if(act==='serah_terima'){ item.status='penggunaan'; log(item,'Serah terima dikonfirmasi pengelola.'); }
      if(act==='selesai_pakai'){ item.status='pengembalian'; log(item,'Pemohon menyelesaikan penggunaan.'); }
      if(act==='konfirmasi_kembali'){ item.status='selesai'; log(item,'Pengembalian dikonfirmasi. Siklus selesai.'); }

      await saveData();
      render();
    });
  });
}

function tickClock(){
  document.getElementById('clock').textContent = new Date().toLocaleString('id-ID', {dateStyle:'full', timeStyle:'short'});
}

(async function init(){
  tickClock(); setInterval(tickClock, 30000);
  await loadConfig();
  await loadData();
  if(CONFIG.scriptUrl) await pullFromGoogleSheet();
  render();
})();
</script>
</body>
</html>
